name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: sửa mô tả PR (thêm Kết luận Reviewer) thì kiểm lại
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scope cần so với origin/main
      # Thêm bước cài ngôn ngữ của dự án ở đây (setup-node, rust-toolchain…); Python đã có bên dưới cho pos.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python pos.py check
      - name: Kiểm Scope của thẻ (luật cứng 8), chống --no-verify
        # Chạy bản pos.py của nhánh đích, không phải bản trong PR: PR không tự nới được máy chặn Scope.
        if: github.event_name == 'pull_request'
        env:
          PROJECT_OS_BRANCH: ${{ github.head_ref }}
          PROJECT_OS_ROOT: ${{ github.workspace }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/$BASE_REF:pos.py" > "$RUNNER_TEMP/pos.py" 2>/dev/null; then
            python "$RUNNER_TEMP/pos.py" scope
          else
            python pos.py scope  # nhánh đích chưa có pos.py (PR đầu tiên của dự án)
          fi
      - name: Kiểm Kết luận Reviewer cho PR Lane Strict (luật cứng 7)
        if: github.event_name == 'pull_request'
        env:
          PROJECT_OS_BRANCH: ${{ github.head_ref }}
          PROJECT_OS_ROOT: ${{ github.workspace }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          # Dùng bản pos.py của nhánh đích (bước Scope đã lấy về); nhánh đích chưa có lệnh này thì dùng bản của PR.
          if [ -s "$RUNNER_TEMP/pos.py" ] && grep -q '"review-check"' "$RUNNER_TEMP/pos.py"; then
            python "$RUNNER_TEMP/pos.py" review-check BODY="$RUNNER_TEMP/pr-body.md"
          else
            python pos.py review-check BODY="$RUNNER_TEMP/pr-body.md"
          fi
      - name: Kiểm plan theo Wave
        run: python pos.py plan-check

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tiêu đề PR (luật cứng 4)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|refactor|test|docs)\([A-Z]+-[0-9]{2,}(,[A-Z]+-[0-9]{2,})*\): [^[]+( \[T-[0-9]{3,}\])?$|^chore: [^[]+( \[T-[0-9]{3,}\])?$'; then
            echo "Tiêu đề PR đúng mẫu."
          else
            echo "Tiêu đề PR sai mẫu: $TITLE"
            echo "Đúng: feat(MAP-07): add store map API [T-042]  ·  chore: bump ruff"
            exit 1
          fi
