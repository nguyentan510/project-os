# CI của chính repo project-os (khác template/.github/workflows/ci.yml là CI chép vào dự án).
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cấu hình git cho test (test tạo repo tạm và commit)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Test công cụ (init, audit, pos.py, features.py)
        run: python -m unittest discover -s tests -v
      - name: Thử cài và gỡ bằng gói npm
        run: |
          d="$RUNNER_TEMP/proj"
          mkdir -p "$d"
          node bin/project-os.js --dir "$d"
          test -f "$d/.agents/skills/project-os/SKILL.md"
          test -f "$d/.claude/skills/project-os/SKILL.md"
          node bin/project-os.js --dir "$d" --uninstall
          test ! -e "$d/.agents/skills/project-os"
